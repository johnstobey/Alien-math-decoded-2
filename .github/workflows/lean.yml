name: Lean proof build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Check theorem inventory and axioms
        run: python3 scripts/audit.py
      - name: Run station codec walkthrough
        run: lake env lean examples/StationWalkthrough.lean
      - name: Run sourced cipher walkthrough
        run: lake env lean examples/CipherWalkthrough.lean
      - name: Check JavaScript cipher fixtures
        run: node scripts/cipher-fixtures.mjs
      - name: Require warning-free source key declarations
        run: |
          lake env lean IndependentDuodenary/SourceKeyRepresentation.lean 2>&1 | tee source-key-check.log
          test ! -s source-key-check.log
      - name: Verify operator and exact-key directives
        run: lake env lean examples/KeyDirectives.lean
      - name: Require warning-free register declarations
        run: |
          for proof_module in RegisterDynamics RegisterBridge
          do
            lake env lean "IndependentDuodenary/$proof_module.lean" 2>&1 | tee register-check.log
            test ! -s register-check.log
          done
      - name: Verify product dynamics and modular bridge
        run: lake env lean examples/RegisterDirectives.lean
      - name: Require warning-free canonical architecture
        run: |
          for proof_module in RegisterNaturality RegisterDynamics CanonicalArchitecture
          do
            lake env lean "IndependentDuodenary/$proof_module.lean" 2>&1 | tee canonical-check.log
            test ! -s canonical-check.log
          done
      - name: Verify canonical operational envelope
        run: lake env lean examples/CanonicalDirectives.lean
      - name: Require warning-free synthesis and harness
        run: |
          for proof_module in PipelineSynthesis PipelineHarness
          do
            lake env lean "IndependentDuodenary/$proof_module.lean" 2>&1 | tee synthesis-check.log
            test ! -s synthesis-check.log
          done
          lake env lean PipelineMain.lean 2>&1 | tee runner-check.log
          test ! -s runner-check.log
          lake env lean examples/PipelineRunner.lean 2>&1 | tee pipeline-runner-check.log
          test ! -s pipeline-runner-check.log
      - name: Check arbitrary station-program closure
        run: lake env lean examples/PipelineDirectives.lean
      - name: Run executable verification guard
        run: lake exe verifyPipeline
      - name: Ensure dependency lockfile stayed unchanged
        run: git diff --exit-code -- lake-manifest.json lean-toolchain
