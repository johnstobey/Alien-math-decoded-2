name: Lean proof build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Check theorem inventory and axioms
        run: python3 scripts/audit.py
      - name: Run station codec walkthrough
        run: lake env lean examples/StationWalkthrough.lean
      - name: Run sourced cipher walkthrough
        run: lake env lean examples/CipherWalkthrough.lean
      - name: Check JavaScript cipher fixtures
        run: node scripts/cipher-fixtures.mjs
      - name: Require warning-free source key declarations
        run: |
          lake env lean IndependentDuodenary/SourceKeyRepresentation.lean 2>&1 | tee .lake/source-key-check.log
          test ! -s .lake/source-key-check.log
      - name: Verify operator and exact-key directives
        run: lake env lean examples/KeyDirectives.lean
      - name: Require warning-free register declarations
        run: |
          for proof_module in RegisterDynamics RegisterBridge
          do
            lake env lean "IndependentDuodenary/$proof_module.lean" 2>&1 | tee .lake/register-check.log
            test ! -s .lake/register-check.log
          done
      - name: Verify product dynamics and modular bridge
        run: lake env lean examples/RegisterDirectives.lean
      - name: Require warning-free canonical architecture
        run: |
          for proof_module in RegisterNaturality RegisterDynamics CanonicalArchitecture
          do
            lake env lean "IndependentDuodenary/$proof_module.lean" 2>&1 | tee .lake/canonical-check.log
            test ! -s .lake/canonical-check.log
          done
      - name: Verify canonical operational envelope
        run: lake env lean examples/CanonicalDirectives.lean
      - name: Require warning-free synthesis and harness
        run: |
          for proof_module in PipelineSynthesis PipelineHarness
          do
            lake env lean "IndependentDuodenary/$proof_module.lean" 2>&1 | tee .lake/synthesis-check.log
            test ! -s .lake/synthesis-check.log
          done
          lake env lean PipelineMain.lean 2>&1 | tee .lake/runner-check.log
          test ! -s .lake/runner-check.log
          lake env lean examples/PipelineRunner.lean 2>&1 | tee .lake/pipeline-runner-check.log
          test ! -s .lake/pipeline-runner-check.log
      - name: Check arbitrary station-program closure
        run: lake env lean examples/PipelineDirectives.lean
      - name: Run executable verification guard
        run: lake exe verifyPipeline
      - name: Check formal complexity boundary without diagnostics
        run: |
          for proof_file in IndependentDuodenary/MillenniumBridge.lean examples/MillenniumBoundary.lean
          do
            lake env lean "$proof_file" 2>&1 | tee .lake/millennium-check.log
            test ! -s .lake/millennium-check.log
          done
      - name: Check reachability decision and global search boundary
        run: |
          for proof_file in IndependentDuodenary/SearchBoundary.lean examples/SearchBoundary.lean
          do
            lake env lean "$proof_file" 2>&1 | tee .lake/search-boundary-check.log
            test ! -s .lake/search-boundary-check.log
          done
      - name: Install monograph compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended
      - name: Export source audit bundle with translation monograph
        run: |
          scripts/perfect_claim_bundle.sh --output dist
          cd dist
          sha256sum --check *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: formal-audit-bundle
          path: dist/*
      - name: Ensure dependency lockfile stayed unchanged
        run: git diff --exit-code -- lake-manifest.json lean-toolchain
